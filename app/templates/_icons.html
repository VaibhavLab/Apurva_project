{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'mark' %}<path d="M12 20C6 17 3 12 5 7c4-1 7 3 7 8 0-5 3-9 7-8 2 5-1 10-7 13Z"/><path d="M12 14C9 10 9 5 12 3c3 2 3 7 0 11Z"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'chat' %}<path d="M21 11a9 9 0 0 1-9 9 10 10 0 0 1-4-1l-5 2 1-5a9 9 0 1 1 17-5Z"/><path d="M8 10h8m-8 4h5"/>
{% elif name == 'spark' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>
{% elif name == 'play' %}<rect x="3" y="4" width="18" height="16" rx="4"/><path d="m10 8 6 4-6 4V8Z"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'send' %}<path d="M12 19V5m-6 6 6-6 6 6"/>
{% elif name == 'logout' %}<path d="M10 4H4v16h6m-1-8h12m-4-4 4 4-4 4"/>
{% elif name == 'wave' %}<path d="M2 12h3l2-7 4 14 3-12 3 5h5"/>
{% elif name == 'moon' %}<path d="M20 14A9 9 0 0 1 10 4a9 9 0 1 0 10 10Z"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>
{% elif name == 'eye' %}<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% endif %}</svg>
{%- endmacro %}
